name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Check tag matches pom version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          POM=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "tag=$TAG pom=$POM"
          test "$TAG" = "$POM"
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: burp-mcp-server
          path: target/burp-mcp-server.jar

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: burp-mcp-server
          path: dist
      - name: Publish release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/burp-mcp-server.jar --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/burp-mcp-server.jar --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
